<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ajatananda Ashram — Guest Viewer</title>
  <link rel="icon" type="image/png" href="icon-64.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ashram Dashboard">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #121212;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>
  <!-- Embedded rather than redirected to on purpose. A redirect makes
       script.google.com the top-level page, which falls outside this app's
       manifest scope — the browser then shows an address bar and Apps Script
       adds its "created by a Google Apps Script user" banner, so the
       installed app stops looking like an app. Keeping it in an iframe holds
       the top-level document on this origin and avoids both.

       The full app has to use a redirect instead, because Google refuses to
       render its sign-in inside a third-party iframe. That does not apply
       here: this dashboard is public and never asks anyone to sign in. If it
       ever gains a sign-in requirement, this must go back to a redirect. -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbxQqYa--L7DTNXONCxwDXpjJ7KoY4CnuHJVWJE67JfvZX9glEI62VKmPvE_ZkVwNIyq/exec"
    title="Ajatananda Ashram Guest Viewer"
    allow="clipboard-write"
  ></iframe>
</body>
</html>
